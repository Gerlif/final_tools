services:
  frameio-export-watcher:
    build:
      context: .
      args:
        # Match the UID/GID that owns the Synology share.
        PUID: 1026
        PGID: 100
    image: frameio-export-watcher:1.0.0
    container_name: frameio-export-watcher
    restart: unless-stopped
    # Synology shares commonly have no POSIX permissions at all (`d---------+`),
    # with access granted only through DSM's ACLs -- there is then no ordinary
    # UID that can read them, so the watcher runs as root. This overrides the
    # PUID/PGID above; the share is mounted read-only, so the container still
    # cannot write to it. Comment this line out to use PUID/PGID instead, on a
    # share whose POSIX permissions do grant access.
    user: "0:0"
    # Shares the NAS's process namespace so the stability check can see whether
    # the file server still holds an export file open. Without it the check has
    # nothing to look at; comment both this and use_open_handle_check out to run
    # on size-and-mtime stability alone.
    pid: host
    # Credentials come from .env next to this file. Compose passes every
    # variable in it straight into the container, so switching between IMS
    # credentials and a legacy token needs no change here. A missing .env
    # fails the start with a clear error instead of starting without secrets.
    env_file:
      - .env
    environment:
      LOG_LEVEL: INFO
      TZ: Europe/Copenhagen
    # Docker's default json-file driver never rotates, so a long-running
    # service can quietly fill the volume with its own log.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Read-only: the watcher never writes to the production share.
      # Left side is the path on the NAS, right side is what config.yaml's
      # watch.root points at -- change the left side only.
      - /volume1/AktiveProjekter:/data/AktiveProjekter:ro
      - ./config.yaml:/config/config.yaml:ro
      - frameio-state:/state

volumes:
  frameio-state:
