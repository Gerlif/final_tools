services:
  frameio-export-watcher:
    build:
      context: .
      args:
        # Match the UID/GID that owns the Synology share.
        PUID: 1026
        PGID: 100
    image: frameio-export-watcher:1.0.0
    container_name: frameio-export-watcher
    restart: unless-stopped
    environment:
      FRAMEIO_CLIENT_ID: "${FRAMEIO_CLIENT_ID}"
      FRAMEIO_CLIENT_SECRET: "${FRAMEIO_CLIENT_SECRET}"
      # FRAMEIO_ACCOUNT_ID: ""
      LOG_LEVEL: INFO
      TZ: Europe/Copenhagen
    volumes:
      # Read-only: the watcher never writes to the production share.
      - /volume1/FinalKlip/AktiveProjekter:/data/AktiveProjekter:ro
      - ./config.yaml:/config/config.yaml:ro
      - frameio-state:/state
    # Uncomment to let the stability check see Samba's open file handles.
    # pid: host

volumes:
  frameio-state:
